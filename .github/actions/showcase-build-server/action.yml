name: Showcase build server image
description: Build and push digital-trust-showcase-server to GHCR (provenance + SBOM)
inputs:
  image:
    description: Full image reference without tag (e.g. ghcr.io/bcgov/digital-trust-showcase-server)
    required: true
  tag:
    description: Image tag (e.g. main or pr-42)
    required: true
  github_token:
    description: Token with packages write (typically secrets.GITHUB_TOKEN)
    required: true
  sbom:
    description: Generate an SBOM (enable for released images; skip for ephemeral PR/dev builds to save time)
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

    # ghcr.io org packages: use repository owner (lowercase) with GITHUB_TOKEN — not github.actor
    # (avoids "denied: installation not allowed to Write organization package"). See GitHub Packages docs.
    - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ inputs.github_token }}

    - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

    - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

    - id: meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
      with:
        images: ${{ inputs.image }}
        tags: |
          type=raw,value=${{ inputs.tag }}

    - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
      with:
        context: .
        file: ./server/Dockerfile
        push: true
        platforms: linux/amd64,linux/arm64
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        annotations: ${{ steps.meta.outputs.annotations }}
        provenance: mode=min
        sbom: ${{ inputs.sbom }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
